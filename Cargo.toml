[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "apps/spectrumiq-desktop/src-tauri", "xtask"]
# The Tauri app's folder holds its web side; its Rust crate is in `src-tauri`.
exclude = ["apps/spectrumiq-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum supported version is teta-wot's; the pinned toolchain is newer.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lucaswewa/SpectrumIQ"
# Nothing is published to crates.io.
publish = false

# Shared versions. Where teta-wot uses a crate, the requirement matches teta-wot's, so the two
# resolve to one copy. Every version was published at least two weeks before it was added.
[workspace.dependencies]
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.1.0" }

anyhow = "1.0"
# Password hashes (ADR-0065): argon2id, RustCrypto's, with its PHC strings; salts from the operating
# system through getrandom.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
# Plain-data views of GPU buffers. Already in the lockfile.
bytemuck = "1.25"
# Compiles the Euresys shim with MSVC, with siq-euresys-sys's `sdk` feature. Already in the lockfile.
cc = "1.5.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8.2"
# Deflate, for OME-TIFF tiles. Already in the lockfile, through png and tiff, at the version pinned in
# P1.4.
flate2 = "1.1"
# `executor::block_on`, for wgpu's futures on the GPU thread. Already in the lockfile.
futures = "0.3.34"
# Session identifiers and salts from the operating system. Already in the lockfile.
getrandom = "0.4.3"
insta = { version = "1.48", features = ["json"] }
# Reading streamed bodies in the server's tests: teta-wot's version.
http-body-util = "0.1.5"
# Preview JPEGs. Its licence includes IJG, allowed with its attribution (ADR-0028).
jpeg-encoder = "0.7.1"
# The deep-zoom tile cache. Already in the lockfile, through zarrs.
lru = "0.16"
# Reading raw frames back, mapped. 0.9.12 is under two weeks old.
memmap2 = "0.9.11"
# WGSL validation in siq-gpu's tests: wgpu's own version.
naga = { version = "30.0.1", features = ["wgsl-in"] }
proptest = "1.11"
png = "0.18.1"
rayon = "1.12"
# Real-to-complex FFTs, for phase correlation (ADR-0048): the rows by realfft, the columns by the
# rustfft under it.
realfft = "3.5"
rustfft = "6.4"
# Dialect templates compile to regexes. regex-automata and regex-syntax are already in the lockfile.
regex = "1.13.1"
# The web app's build, embedded in release builds of the server and read from disk in debug ones.
rust-embed = "8.13"
schemars = { version = "1.2", features = ["preserve_order", "indexmap2", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: parse every f64 back exactly (calibrations, poses), not to within one ULP.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The hashes of a dataset's instrument and calibration snapshots. Already in the lockfile, through
# rust-embed.
sha2 = "0.11.0"
tempfile = "3.27"
thiserror = "2.0"
# Uncompressed, LZW and deflate TIFFs: what microscopy software writes. No JPEG, fax or WebP.
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
# teta-wot's requirement, with no features: each crate names the ones it uses.
tokio = "1.47"
# Serial ports, through serialport (MPL-2.0, used unmodified: ADR-0028).
tokio-serial = { version = "5.5.0", default-features = false }
toml = "1.1.6"
# `oneshot`, to read the OpenAPI document without serving: teta-wot's version.
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["std", "registry", "fmt", "ansi", "env-filter"] }
# The GPU (ADR-0058): DX12 and Vulkan on Windows, and WGSL. Not GL, Metal or WebGPU.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
# OME-Zarr: Zarr v3 arrays on disk, zstd-compressed (ADR-0042). zstd-sys is C, allowed by ADR-0007.
zarrs = { version = "0.23.14", default-features = false, features = ["filesystem", "zstd"] }
# Already in the lockfile through tempfile and clap, and teta-wot's version.
windows-sys = "0.61.2"

# argon2id at its 19 MiB costs seconds a hash unoptimised: the tests hash at the service's cost.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
# Unsafe code is allowed only where ADR-0007 lists it, with `#![allow(unsafe_code)]` there.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
