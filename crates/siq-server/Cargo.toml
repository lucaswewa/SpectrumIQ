[package]
name = "siq-server"
description = "SpectrumIQ's service core: the instrument's Things on teta-wot, its routes, and the devices chosen from the configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The Euresys camera (`[camera] kind = "euresys"`), through the installed eGrabber SDK.
euresys = ["dep:siq-euresys", "siq-euresys/sdk"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
jpeg-encoder.workspace = true
rust-embed.workspace = true
schemars = { workspace = true, features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
siq-acquire = { path = "../siq-acquire" }
siq-ascii = { path = "../siq-ascii" }
siq-auth = { path = "../siq-auth" }
siq-buffer = { path = "../siq-buffer" }
siq-calib = { path = "../siq-calib" }
siq-config = { path = "../siq-config" }
siq-devices = { path = "../siq-devices" }
siq-euresys = { path = "../siq-euresys", optional = true }
siq-gpu = { path = "../siq-gpu" }
siq-grbl = { path = "../siq-grbl" }
siq-imgproc = { path = "../siq-imgproc" }
siq-jobs = { path = "../siq-jobs" }
siq-preview = { path = "../siq-preview" }
siq-pyramid = { path = "../siq-pyramid" }
siq-register = { path = "../siq-register" }
siq-serial = { path = "../siq-serial" }
siq-sim = { path = "../siq-sim" }
siq-stitch = { path = "../siq-stitch" }
siq-stitch-live = { path = "../siq-stitch-live" }
siq-storage = { path = "../siq-storage" }
siq-synth = { path = "../siq-synth" }
siq-telemetry = { path = "../siq-telemetry" }
siq-types = { path = "../siq-types" }
siq-workflow = { path = "../siq-workflow" }
teta-wot.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "signal", "sync", "time"] }
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
insta.workspace = true
png.workspace = true
siq-acquire = { path = "../siq-acquire" }
siq-datagen = { path = "../../apps/siq-datagen" }
siq-auth = { path = "../siq-auth" }
tempfile.workspace = true
teta-wot = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true
