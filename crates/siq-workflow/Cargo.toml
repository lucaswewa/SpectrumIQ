[package]
name = "siq-workflow"
description = "Workflows: the engine that runs acquisition plans, and the routines that move the instrument and measure it, such as the stage-camera calibration and the shading captures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
siq-acquire = { path = "../siq-acquire" }
siq-buffer = { path = "../siq-buffer" }
siq-calib = { path = "../siq-calib" }
siq-config = { path = "../siq-config" }
siq-devices = { path = "../siq-devices" }
siq-imgproc = { path = "../siq-imgproc" }
siq-register = { path = "../siq-register" }
siq-storage = { path = "../siq-storage" }
siq-types = { path = "../siq-types" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
siq-grbl = { path = "../siq-grbl" }
siq-serial = { path = "../siq-serial" }
siq-sim = { path = "../siq-sim" }
siq-synth = { path = "../siq-synth" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
