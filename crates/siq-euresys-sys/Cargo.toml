[package]
name = "siq-euresys-sys"
description = "Euresys eGrabber through SpectrumIQ's C++ shim: the shim's C ABI, and its Rust bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Compiles the shim against the installed eGrabber SDK (EGRABBER_SDK_DIR). Without it, the types
# and constants build without the SDK, and the functions aren't linked.
sdk = ["dep:cc"]

[build-dependencies]
cc = { workspace = true, optional = true }

[dev-dependencies]
# The raw frame `eg_fps` saves.
tiff.workspace = true

[[example]]
name = "eg_discover"
required-features = ["sdk"]

[[example]]
name = "eg_fps"
required-features = ["sdk"]

[lints]
workspace = true
