[package]
name = "siq-jobs"
description = "The job system: heavy processing in the background, admitted within the RAM and GPU budgets, on below-normal-priority threads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
rayon.workspace = true
schemars = { workspace = true, features = ["chrono04"] }
serde.workspace = true
serde_json.workspace = true
siq-calib = { path = "../siq-calib" }
siq-imgproc = { path = "../siq-imgproc" }
siq-pyramid = { path = "../siq-pyramid" }
siq-stitch = { path = "../siq-stitch" }
siq-storage = { path = "../siq-storage" }
siq-telemetry = { path = "../siq-telemetry" }
siq-types = { path = "../siq-types" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
siq-datagen = { path = "../../apps/siq-datagen" }
siq-types = { path = "../siq-types" }
tempfile.workspace = true
tiff.workspace = true

[lints]
workspace = true
