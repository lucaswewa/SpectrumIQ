[package]
name = "siq-sim"
description = "SpectrumIQ's simulators: the camera and its image formation, the GRBL and dialect emulators, and the peripheral simulators."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
siq-ascii = { path = "../siq-ascii" }
siq-buffer = { path = "../siq-buffer" }
siq-config = { path = "../siq-config" }
siq-devices = { path = "../siq-devices" }
siq-imgproc = { path = "../siq-imgproc" }
siq-synth = { path = "../siq-synth" }
siq-types = { path = "../siq-types" }
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }

[dev-dependencies]
png.workspace = true
siq-grbl = { path = "../siq-grbl" }
siq-serial = { path = "../siq-serial" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
